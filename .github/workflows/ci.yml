name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-macos:
    name: Host build + tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: brew install cmake pkg-config sdl2 sdl2_ttf ffmpeg opus openssl@3

      - name: Build and run unit tests
        run: bash scripts/build-host.sh --test
